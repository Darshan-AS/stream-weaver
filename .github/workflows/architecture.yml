name: Validate tenants & publish architecture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Tenant whose LikeC4 model is published to GitHub Pages.
  PAGES_TENANT: don

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint, type-check, unit tests (incl. boundary lint)
        run: |
          uv run ruff check src tests
          uv run mypy
          uv run pytest

      - name: Validate every tenant offline (schema, documents, architecture sync)
        run: uv run sw validate --all-tenants

  build-pages:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build LikeC4 static architecture site
        run: npx --yes likec4 build "tenants/${PAGES_TENANT}/architecture" --base /stream-weaver/ -o dist/architecture

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/architecture

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
