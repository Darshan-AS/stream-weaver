name: Validate tenants & publish architecture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Optional repository variable override; auto-falls back to first tenant under tenants/ or examples/home.
  PAGES_TENANT: ${{ vars.PAGES_TENANT }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint, type-check, unit tests (incl. boundary lint)
        run: |
          uv run ruff check src tests
          uv run mypy
          uv run pytest

      - name: Validate starter fixture and any repo tenants offline (schema, documents, architecture sync)
        run: |
          uv run sw validate --dir examples/home
          if find tenants -mindepth 2 -maxdepth 2 -name tenant.json 2>/dev/null | grep -q .; then
            uv run sw validate --all-tenants
          fi

  build-pages:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build LikeC4 static architecture site
        run: |
          if [[ -n "${PAGES_TENANT}" && -d "tenants/${PAGES_TENANT}/architecture" ]]; then
            ARCH_DIR="tenants/${PAGES_TENANT}/architecture"
          else
            FIRST_TENANT="$(find tenants -mindepth 2 -maxdepth 2 -name tenant.json 2>/dev/null | sort | head -n 1 | xargs -r dirname || true)"
            if [[ -n "${FIRST_TENANT}" && -d "${FIRST_TENANT}/architecture" ]]; then
              ARCH_DIR="${FIRST_TENANT}/architecture"
            else
              ARCH_DIR="examples/home/architecture"
            fi
          fi
          echo "Building LikeC4 site from ${ARCH_DIR}"
          npx --yes likec4 build "${ARCH_DIR}" --base "/${GITHUB_REPOSITORY#*/}/" -o dist/architecture

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/architecture

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
